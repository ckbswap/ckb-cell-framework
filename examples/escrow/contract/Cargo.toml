[package]
name = "framework-escrow-script"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.ckb-contract]
# cargo cell test uses this registration to build the contract and run its VM test package.
vm-tests = "framework-vm-tests"

[lib]
path = "src/lib.rs"

[features]
# Select the VM binary without conditionally compiling the business library.
vm = []

[[bin]]
# main.rs is the VM entry point; host tests use the reusable contract library by default.
name = "framework-escrow-script"
path = "src/main.rs"
required-features = ["vm"]
test = false
bench = false

[dependencies]
ckb-contract-derive.workspace = true
ckb-contract-core.workspace = true
ckb-contract-onchain.workspace = true
ckb-std.workspace = true
